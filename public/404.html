<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ABSIM AUTOMOTIVE</title>
    <script>
      // Automatically redirect 404 routes on GitHub Pages back to the index page
      var path = window.location.pathname;
      var origin = window.location.origin;
      // If we are in a subfolder like /<repo>/some-path, keep the /<repo>/ part
      var segments = path.split('/').filter(Boolean);
      var repoBase = segments.length > 0 ? '/' + segments[0] + '/' : '/';
      window.location.replace(origin + repoBase + window.location.search + window.location.hash);
    </script>
  </head>
  <body style="background-color: #0B0D10; color: #F3F4F6;">
  </body>
</html>
